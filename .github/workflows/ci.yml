name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ArenaDesktop.sln

      - name: Build (Release)
        run: dotnet build ArenaDesktop.sln -c Release --no-restore

      - name: Test (core logic)
        run: dotnet test tests/ArenaDesktop.Core.Tests -c Release --no-build --logger "trx;LogFileName=results.trx"

      # TEMPORARY CI DIAGNOSTIC — remove before merge.
      - name: Diagnostic — publish failing test names
        if: failure() || success()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $lines = @()
          $trx = Get-ChildItem -Path . -Recurse -Filter *.trx -ErrorAction SilentlyContinue
          if (-not $trx) { $lines += "no trx found" }
          foreach ($f in $trx) {
            [xml]$x = Get-Content $f.FullName
            foreach ($r in $x.TestRun.Results.UnitTestResult | Where-Object { $_.outcome -ne 'Passed' }) {
              $lines += "FAILED: $($r.testName)"
              $lines += "MSG: $($r.Output.ErrorInfo.Message)"
              $lines += "STACK: $($r.Output.ErrorInfo.StackTrace)"
            }
          }
          $summary = ($lines -join "`n")
          if ($summary.Length -gt 60000) { $summary = $summary.Substring(0, 60000) }
          $sha = "${{ github.event.pull_request.head.sha }}"
          if (-not $sha) { $sha = "${{ github.sha }}" }
          $runs = gh api "repos/${{ github.repository }}/commits/$sha/check-runs?per_page=100" | ConvertFrom-Json
          foreach ($cr in $runs.check_runs) {
            if ($cr.head_sha -eq $sha -and $cr.name -notmatch 'arm64') {
              $body = @{ output = @{ title = "failing tests"; summary = $summary } } | ConvertTo-Json -Depth 5
              $tmp = Join-Path $env:RUNNER_TEMP "patch.json"
              Set-Content -Path $tmp -Value $body -Encoding utf8
              gh api --method PATCH "repos/${{ github.repository }}/check-runs/$($cr.id)" --input $tmp | Out-Null
              Write-Host "patched check run $($cr.id)"
            }
          }

      - name: Publish (win-x64, self-contained)
        run: dotnet publish src/ArenaDesktop/ArenaDesktop.csproj -c Release -r win-x64 --self-contained true -o publish/win-x64

      - name: Stage release folder
        shell: pwsh
        run: |
          Copy-Item README.md, LICENSE, KNOWN_LIMITATIONS.md, RELEASE_CHECKLIST.md publish/win-x64/

      - name: Smoke test (window construction + WebView2 init)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "publish/win-x64/ArenaDesktop.exe" -ArgumentList "--smoke-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Smoke test failed with exit code $($p.ExitCode)" }

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ArenaDesktop-win-x64
          path: publish/win-x64
          if-no-files-found: error
  build-arm64:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ArenaDesktop.sln

      - name: Build (Release)
        run: dotnet build ArenaDesktop.sln -c Release --no-restore

      - name: Test (core logic)
        run: dotnet test tests/ArenaDesktop.Core.Tests -c Release --no-build

      - name: Publish (win-arm64, self-contained)
        run: dotnet publish src/ArenaDesktop/ArenaDesktop.csproj -c Release -r win-arm64 --self-contained true -o publish/win-arm64

      - name: Stage release folder
        shell: pwsh
        run: |
          Copy-Item README.md, LICENSE, KNOWN_LIMITATIONS.md, RELEASE_CHECKLIST.md publish/win-arm64/

      - name: Smoke test (window construction + WebView2 init)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "publish/win-arm64/ArenaDesktop.exe" -ArgumentList "--smoke-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Smoke test failed with exit code $($p.ExitCode)" }

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ArenaDesktop-win-arm64
          path: publish/win-arm64
          if-no-files-found: error
