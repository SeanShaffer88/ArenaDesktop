name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ArenaDesktop.sln

      - name: Build (Release)
        run: dotnet build ArenaDesktop.sln -c Release --no-restore

      # --logger trx gives the next step a machine-readable result file;
      # the step after it turns every failure into an ::error annotation.
      # Without that, a failed test is invisible from the PR: the run log
      # is a zip the API serves as an opaque blob, so the only thing a
      # reader (or an agent) can see is "Process completed with exit code 1".
      - name: Test (core logic)
        run: dotnet test tests/ArenaDesktop.Core.Tests -c Release --no-build --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Report failed tests
        if: failure()
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path TestResults -Filter *.trx -Recurse -ErrorAction SilentlyContinue
          if (-not $files) { Write-Host "No .trx file was produced."; exit 0 }
          foreach ($file in $files) {
            [xml]$trx = Get-Content $file.FullName
            $failed = $trx.TestRun.Results.UnitTestResult | Where-Object { $_.outcome -eq 'Failed' }
            foreach ($r in $failed) {
              $msg = ($r.Output.ErrorInfo.Message -split "`n")[0]
              $detail = ($r.Output.ErrorInfo.StackTrace -split "`n" | Select-Object -First 3) -join ' | '
              Write-Host "::error title=$($r.testName)::$msg $detail"
            }
            Write-Host "Failed tests in $($file.Name): $(@($failed).Count)"
          }

      - name: Publish (win-x64, self-contained)
        run: dotnet publish src/ArenaDesktop/ArenaDesktop.csproj -c Release -r win-x64 --self-contained true -o publish/win-x64

      - name: Stage release folder
        shell: pwsh
        run: |
          Copy-Item README.md, LICENSE, KNOWN_LIMITATIONS.md, RELEASE_CHECKLIST.md publish/win-x64/

      - name: Smoke test (window construction + WebView2 init)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "publish/win-x64/ArenaDesktop.exe" -ArgumentList "--smoke-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Smoke test failed with exit code $($p.ExitCode)" }

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ArenaDesktop-win-x64
          path: publish/win-x64
          if-no-files-found: error
